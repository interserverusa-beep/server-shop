<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Shop - Premium Servers</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="landing-container">
        <div class="site-logo">
            <img src="images/logo.png" alt="Server Shop Logo" class="logo-image">
            <span class="logo-text">Server Shop</span>
        </div>
        
        <h1 style="font-size: 2.2rem; margin-bottom: 15px; color: #1a252f;">Premium High-Performance Servers</h1>
        <p style="color: #718096; font-size: 1.1rem; margin-bottom: 30px; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.6;">
            Deploy your applications on enterprise-grade infrastructure with 99.9% uptime, advanced DDoS protection, and 24/7 expert support.
        </p>
        
        <div class="landing-buttons">
            <button onclick="window.location.href='login.html'" class="btn-primary btn-large">👤 Login / Sign Up</button>
            <button onclick="window.location.href='login.html'" class="btn-secondary btn-large">🖥️ Buy Server</button>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script>

        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
