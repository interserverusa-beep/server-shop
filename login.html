<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Server Shop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <div class="login-container">
        <h2>Login / Sign Up</h2>
        
        <!-- Step 1: Email & Password -->
        <div id="step1">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button onclick="sendVerificationCode()" class="btn-primary">
                📧 Send Verification Code
            </button>
        </div>

        <!-- Step 2: Verification Code -->
        <div id="step2" style="display: none;">
            <p style="color: #666; margin-bottom: 20px;">
                A verification code has been sent to <strong id="display-email"></strong>
            </p>
            
            <div class="form-group">
                <label>Verification Code</label>
                <input type="text" id="verification-code" placeholder="Enter 6-digit code" maxlength="6" required>
            </div>
            
            <button onclick="verifyCode()" class="btn-primary">
                ✓ Verify & Login
            </button>
            
            <button onclick="resendCode()" class="btn-secondary" style="margin-top: 10px;">
                🔄 Resend Code
            </button>
        </div>
        
        <p id="message"></p>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        // Initialize EmailJS with your Public Key
        (function() {
            emailjs.init("zT9odo_BZdPqwVm4B");
        })();

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        let currentUserEmail = '';
        let currentUserPassword = '';
        let generatedCode = '';

        async function sendVerificationCode() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');

            if (!email || !password) {
                message.style.color = 'red';
                message.textContent = 'Please enter email and password';
                return;
            }

            message.style.color = 'blue';
            message.textContent = 'Sending verification code...';

            // Generate 6-digit random code
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
            currentUserEmail = email;
            currentUserPassword = password;

            try {
                // Save code to Firestore with expiration time
                await db.collection('verification_codes').doc(email).set({
                    code: generatedCode,
                    email: email,
                    password: password,
                    expiresAt: firebase.firestore.Timestamp.fromDate(
                        new Date(Date.now() + 10 * 60 * 1000) // 10 minutes
                    ),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Send email via EmailJS
                await emailjs.send(
                    'service_00kjwnk',     // Service ID
                    'template_oyd8k5w',    // Template ID
                    {
                        to_email: email,
                        code: generatedCode
                    }
                );

                // Show step 2
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                document.getElementById('display-email').textContent = email;
                
                message.style.color = 'green';
                message.textContent = 'Verification code sent! Check your email.';

            } catch (error) {
                message.style.color = 'red';
                message.textContent = 'Error: ' + error.message;
            }
        }

        async function verifyCode() {
            const enteredCode = document.getElementById('verification-code').value.trim();
            const message = document.getElementById('message');

            if (!enteredCode) {
                message.style.color = 'red';
                message.textContent = 'Please enter verification code';
                return;
            }

            message.style.color = 'blue';
            message.textContent = 'Verifying...';

            try {
                // Get code from Firestore
                const codeDoc = await db.collection('verification_codes').doc(currentUserEmail).get();
                
                if (!codeDoc.exists) {
                    message.style.color = 'red';
                    message.textContent = 'Code not found. Please request a new code.';
                    return;
                }

                const codeData = codeDoc.data();

                // Check if code expired
                if (codeData.expiresAt.toDate() < new Date()) {
                    message.style.color = 'red';
                    message.textContent = 'Code expired. Please request a new code.';
                    return;
                }

                // Verify code
                if (codeData.code !== enteredCode) {
                    message.style.color = 'red';
                    message.textContent = 'Invalid verification code';
                    return;
                }

                // Code is valid - proceed with login/signup
                try {
                    await auth.signInWithEmailAndPassword(currentUserEmail, currentUserPassword);
                    message.style.color = 'green';
                    message.textContent = 'Login successful! Redirecting...';
                    
                    // Delete used code
                    await db.collection('verification_codes').doc(currentUserEmail).delete();
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } catch (authError) {
                    if (authError.code === 'user-not-found') {
                        // Create new account
                        await auth.createUserWithEmailAndPassword(currentUserEmail, currentUserPassword);
                        message.style.color = 'green';
                        message.textContent = 'Account created! Redirecting...';
                        
                        // Delete used code
                        await db.collection('verification_codes').doc(currentUserEmail).delete();
                        
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    } else {
                        message.style.color = 'red';
                        message.textContent = 'Auth error: ' + authError.message;
                    }
                }

            } catch (error) {
                message.style.color = 'red';
                message.textContent = 'Error: ' + error.message;
            }
        }

        async function resendCode() {
            await sendVerificationCode();
        }
    </script>
</body>
</html>
