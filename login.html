<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Server Shop</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    
    <!-- EmailJS SDK (Version 3 for maximum compatibility) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <div class="login-container">
        <!-- Animated Logo (Updated with Image) -->
        <div class="site-logo">
            <img src="images/logo.png" alt="Server Shop Logo" class="logo-image">
            <span class="logo-text">Server Shop</span>
        </div>
        
        <h2>Login / Sign Up</h2>
        
        <!-- Step 1: Email & Password -->
        <div id="step1">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button onclick="sendVerificationCode()" class="btn-primary" id="send-btn">
                📧 Send Verification Code
            </button>
        </div>

        <!-- Step 2: Verification Code -->
        <div id="step2" style="display: none;">
            <p style="color: #666; margin-bottom: 20px;">
                A verification code has been sent to <strong id="display-email"></strong>
            </p>
            
            <div class="form-group">
                <label>Verification Code</label>
                <input type="text" id="verification-code" placeholder="Enter 6-digit code" maxlength="6" required>
            </div>
            
            <button onclick="verifyCode()" class="btn-primary" id="verify-btn">
                ✓ Verify & Login
            </button>
            
            <button onclick="resendCode()" class="btn-secondary" style="margin-top: 10px;">
                🔄 Resend Code
            </button>
        </div>
        
        <p id="message" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        // 1. Initialize EmailJS
        (function() {
            emailjs.init("zT9odo_BZdPqwVm4B"); // Your Public Key
        })();

        // 2. Check auth state
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'index.html'; // Redirect to main dashboard page
            }
        });

        let currentUserEmail = '';
        let currentUserPassword = '';
        let generatedCode = '';

        // Helper function to show messages safely
        function showMessage(text, color) {
            const msgEl = document.getElementById('message');
            msgEl.style.color = color;
            msgEl.textContent = text;
        }

        async function sendVerificationCode() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const sendBtn = document.getElementById('send-btn');

            if (!email || !password) {
                showMessage('Please enter both email and password.', 'red');
                return;
            }

            showMessage('Sending verification code...', 'blue');
            sendBtn.disabled = true; // Prevent double clicks

            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
            currentUserEmail = email;
            currentUserPassword = password;

            try {
                // A. Save to Firestore
                await db.collection('verification_codes').doc(email).set({
                    code: generatedCode,
                    email: email,
                    password: password, 
                    expiresAt: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 10 * 60 * 1000)),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log("✅ Code saved to Firestore successfully.");

                // B. Send Email via EmailJS
                const emailResponse = await emailjs.send(
                    'service_00kjwnk',     // Your Service ID
                    'template_oyd8k5w',    // Your Template ID
                    {
                        to_email: email,
                        code: generatedCode
                    }
                );
                console.log("✅ Email sent successfully:", emailResponse);

                // C. Update UI
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                document.getElementById('display-email').textContent = email;
                showMessage('Verification code sent! Check your email (and Spam folder).', 'green');

            } catch (error) {
                console.error("❌ FULL ERROR OBJECT:", error);
                const errorMsg = error.message || error.toString() || JSON.stringify(error) || 'An unknown error occurred.';
                showMessage('Error: ' + errorMsg, 'red');
            } finally {
                sendBtn.disabled = false;
            }
        }

                async function verifyCode() {
            const enteredCode = document.getElementById('verification-code').value.trim();
            const verifyBtn = document.getElementById('verify-btn');

            if (!enteredCode) {
                showMessage('Please enter the verification code.', 'red');
                return;
            }

            showMessage('Verifying...', 'blue');
            verifyBtn.disabled = true;

            try {
                const codeDoc = await db.collection('verification_codes').doc(currentUserEmail).get();
                
                if (!codeDoc.exists) {
                    showMessage('Code not found. Please request a new code.', 'red');
                    verifyBtn.disabled = false;
                    return;
                }

                const codeData = codeDoc.data();

                if (codeData.expiresAt.toDate() < new Date()) {
                    showMessage('Code expired. Please request a new code.', 'red');
                    verifyBtn.disabled = false;
                    return;
                }

                if (codeData.code !== enteredCode) {
                    showMessage('Invalid verification code. Please check and try again.', 'red');
                    verifyBtn.disabled = false;
                    return;
                }

                // Code is valid! Proceed with Firebase Auth
                try {
                    // 1. ابتدا سعی می‌کنیم کاربر را وارد کنیم
                    await auth.signInWithEmailAndPassword(currentUserEmail, currentUserPassword);
                    showMessage('Login successful! Redirecting...', 'green');
                    await db.collection('verification_codes').doc(currentUserEmail).delete(); // پاکسازی کد
                    setTimeout(() => window.location.href = 'index.html', 1000);
                    
                } catch (authError) {
                    // 2. اگر خطا داد، ممکن است کاربر جدید باشد (به دلیل فعال بودن Email enumeration protection در فایربیس)
                    // بنابراین سعی می‌کنیم اکانت را بسازیم.
                    if (authError.code === 'auth/user-not-found' || authError.code === 'auth/invalid-login-credentials') {
                        try {
                            await auth.createUserWithEmailAndPassword(currentUserEmail, currentUserPassword);
                            showMessage('Account created successfully! Redirecting...', 'green');
                            await db.collection('verification_codes').doc(currentUserEmail).delete();
                            setTimeout(() => window.location.href = 'index.html', 1000);
                        } catch (createError) {
                            // 3. اگر اکانت از قبل با رمز عبور متفاوتی وجود داشته باشد
                            if (createError.code === 'auth/email-already-in-use') {
                                showMessage('This email is already registered with a different password.', 'red');
                            } else {
                                showMessage('Registration error: ' + createError.message, 'red');
                            }
                        }
                    } else {
                        showMessage('Login error: ' + authError.message, 'red');
                    }
                }

            } catch (error) {
                console.error("❌ FULL VERIFY ERROR:", error);
                const errorMsg = error.message || error.toString() || 'Verification failed.';
                showMessage('Error: ' + errorMsg, 'red');
                verifyBtn.disabled = false;
            }
        }
        async function resendCode() {
            showMessage('Resending code...', 'blue');
            await sendVerificationCode();
        }
    </script>
</body>
</html>
