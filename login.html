<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Server Shop</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="login-page">
    <div class="login-container">
        <!-- Animated Logo -->
        <div class="site-logo">
            <img src="images/logo.png" alt="Server Shop Logo" class="logo-image">
            <span class="logo-text">Server Shop</span>
        </div>
        
        <h2 style="color: #1a3a5c; margin-bottom: 10px;">Login / Sign Up</h2>
        <p style="color: #5a6b7c; margin-bottom: 30px;">Enter your credentials to access your account</p>
        
        <!-- Step 1: Email & Password -->
        <div id="step1">
            <div class="form-group">
                <label style="text-align: left; display: block; margin-bottom: 8px; font-weight: 600; color: #1a3a5c;">Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label style="text-align: left; display: block; margin-bottom: 8px; font-weight: 600; color: #1a3a5c;">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button onclick="sendVerificationCode()" class="btn-primary" id="send-btn" style="width: 100%; margin: 20px 0 10px 0;">
                📧 Send Verification Code
            </button>
        </div>

        <!-- Step 2: Verification Code -->
        <div id="step2" style="display: none;">
            <p style="color: #5a6b7c; margin-bottom: 25px; font-size: 15px;">
                A verification code has been sent to <strong id="display-email" style="color: #0070cc;"></strong>
            </p>
            
            <div class="form-group">
                <label style="text-align: left; display: block; margin-bottom: 8px; font-weight: 600; color: #1a3a5c;">Verification Code</label>
                <input type="text" id="verification-code" placeholder="Enter 6-digit code" maxlength="6" required style="text-align: center; font-size: 24px; letter-spacing: 5px;">
            </div>
            
            <button onclick="verifyCode()" class="btn-primary" id="verify-btn" style="width: 100%; margin: 20px 0 10px 0;">
                ✓ Verify & Login
            </button>
            
            <button onclick="resendCode()" class="btn-secondary" style="width: 100%; margin-top: 10px;">
                🔄 Resend Code
            </button>
        </div>
        
        <p id="message" style="margin-top: 20px; font-weight: 600; font-size: 15px; text-align: center;"></p>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        // Initialize EmailJS
        (function() {
            emailjs.init("zT9odo_BZdPqwVm4B");
            console.log("✅ EmailJS initialized");
        })();

        // Check auth state
        auth.onAuthStateChanged((user) => {
            console.log("Auth state changed:", user ? user.email : "No user");
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        let currentUserEmail = '';
        let currentUserPassword = '';
        let generatedCode = '';

        function showMessage(text, color) {
            const msgEl = document.getElementById('message');
            if (msgEl) {
                msgEl.style.color = color;
                msgEl.textContent = text;
                console.log("Message shown:", text);
            } else {
                console.error("Message element not found!");
            }
        }

        async function sendVerificationCode() {
            console.log("=== sendVerificationCode called ===");
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const sendBtn = document.getElementById('send-btn');

            console.log("Email:", email, "Password length:", password.length);

            if (!email || !password) {
                showMessage('Please enter both email and password.', '#c0392b');
                return;
            }

            showMessage('Sending verification code...', '#0070cc');
            sendBtn.disabled = true;

            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
            currentUserEmail = email;
            currentUserPassword = password;

            console.log("Generated code:", generatedCode);

            try {
                // Save to Firestore
                console.log("Saving to Firestore...");
                await db.collection('verification_codes').doc(email).set({
                    code: generatedCode,
                    email: email,
                    password: password,
                    expiresAt: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 10 * 60 * 1000)),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log("✅ Code saved to Firestore successfully.");

                // Send Email via EmailJS
                console.log("Sending email via EmailJS...");
                const emailResponse = await emailjs.send(
                    'service_00kjwnk',
                    'template_oyd8k5w',
                    {
                        to_email: email,
                        code: generatedCode
                    }
                );
                console.log("✅ Email sent successfully:", emailResponse);

                // Show Step 2
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                document.getElementById('display-email').textContent = email;
                showMessage('Verification code sent! Check your email.', '#27ae60');

            } catch (error) {
                console.error("❌ Error in sendVerificationCode:", error);
                showMessage('Error: ' + (error.message || 'Failed to send code'), '#c0392b');
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function verifyCode() {
            console.log("=== verifyCode called ===");
            
            const enteredCode = document.getElementById('verification-code').value.trim();
            const verifyBtn = document.getElementById('verify-btn');

            console.log("Entered code:", enteredCode);

            if (!enteredCode) {
                showMessage('Please enter the verification code.', '#c0392b');
                return;
            }

            showMessage('Verifying...', '#0070cc');
            verifyBtn.disabled = true;

            try {
                // Get code from Firestore
                console.log("Fetching code from Firestore...");
                const codeDoc = await db.collection('verification_codes').doc(currentUserEmail).get();
                
                if (!codeDoc.exists) {
                    console.log(" Code document not found");
                    showMessage('Code not found. Please request a new code.', '#c0392b');
                    verifyBtn.disabled = false;
                    return;
                }

                const codeData = codeDoc.data();
                console.log("Code data:", codeData);

                // Check expiration
                if (codeData.expiresAt.toDate() < new Date()) {
                    console.log(" Code expired");
                    showMessage('Code expired. Please request a new code.', '#c0392b');
                    verifyBtn.disabled = false;
                    return;
                }

                // Verify code
                if (codeData.code !== enteredCode) {
                    console.log("❌ Invalid code. Expected:", codeData.code, "Got:", enteredCode);
                    showMessage('Invalid verification code.', '#c0392b');
                    verifyBtn.disabled = false;
                    return;
                }

                console.log("✅ Code verified successfully!");
                showMessage('Code verified! Logging in...', '#27ae60');

                // Try to sign in
                try {
                    console.log("Attempting sign in...");
                    await auth.signInWithEmailAndPassword(currentUserEmail, currentUserPassword);
                    console.log("✅ Sign in successful!");
                    showMessage('Login successful! Redirecting...', '#27ae60');
                    
                    // Delete used code
                    await db.collection('verification_codes').doc(currentUserEmail).delete();
                    console.log("✅ Verification code deleted");
                    
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                    
                } catch (authError) {
                    console.log("Sign in failed:", authError.code);
                    
                    // If user not found or invalid credentials, try to create account
                    if (authError.code === 'auth/user-not-found' || authError.code === 'auth/invalid-login-credentials') {
                        console.log("Attempting to create new account...");
                        try {
                            await auth.createUserWithEmailAndPassword(currentUserEmail, currentUserPassword);
                            console.log("✅ Account created successfully!");
                            showMessage('Account created successfully! Redirecting...', '#27ae60');
                            
                            await db.collection('verification_codes').doc(currentUserEmail).delete();
                            
                            setTimeout(() => window.location.href = 'dashboard.html', 1000);
                        } catch (createError) {
                            console.error("❌ Account creation failed:", createError.code);
                            if (createError.code === 'auth/email-already-in-use') {
                                showMessage('This email is already registered with a different password.', '#c0392b');
                            } else {
                                showMessage('Registration error: ' + createError.message, '#c0392b');
                            }
                        }
                    } else {
                        console.error("❌ Login error:", authError.code);
                        showMessage('Login error: ' + authError.message, '#c0392b');
                    }
                }

            } catch (error) {
                console.error(" Error in verifyCode:", error);
                showMessage('Error: ' + (error.message || 'Verification failed'), '#c0392b');
                verifyBtn.disabled = false;
            }
        }

        async function resendCode() {
            console.log("=== resendCode called ===");
            showMessage('Resending code...', '#0070cc');
            await sendVerificationCode();
        }
    </script>
</body>
</html>
